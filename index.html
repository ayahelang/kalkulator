<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="description" content="Kalkulator Silverhawk — Kumpulan kalkulator profesional multi-bidang" />
  <title>Kalkulator Silverhawk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-icon">🧮</div>
        <div>
          <div class="logo-text">Kalkulator</div>
          <div class="logo-sub">silverhawk.web.id</div>
        </div>
      </a>
      <div class="status-badge">
        <span class="status-dot"></span>
        System Ready
      </div>
    </div>
  </header>

  <section class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" class="search-input" placeholder="Cari kalkulator... (BMI, subnet, Ohm, delta-v...)" autocomplete="off" />
    </div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="result-count" id="resultCount">Memuat kalkulator...</div>
  </section>

  <main class="gallery" id="gallery"></main>

  <footer class="footer">
    <p>© 2026 <a href="https://silverhawk.web.id" target="_blank" rel="noopener">Silverhawk Network</a> · kalkulator.silverhawk.web.id</p>
  </footer>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Kalkulator</div>
        <button class="modal-close" id="modalClose" aria-label="Tutup">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
